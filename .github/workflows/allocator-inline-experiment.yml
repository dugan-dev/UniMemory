name: allocator inline experiment (preliminary)
on:
  workflow_call:
    inputs:
      source_ref:
        description: Unmodified production revision used for every variant
        type: string
        default: fe90b68
      experiment_kind:
        description: allocator_inline, kind_global or api_boundaries; experimental source copies only
        type: string
        default: allocator_inline
permissions:
  contents: read
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {os: ubuntu-24.04, label: linux-x64}
          - {os: windows-2022, label: windows-x64}
          - {os: macos-15, label: macos-arm64}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build existing pinned SDKs without third-party tests
        if: runner.os != 'Windows'
        run: bash tools/ci/build-backends.sh
      - name: Windows existing pinned SDKs and matched MD runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git build/vcpkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C build/vcpkg checkout 2273a28f34ce5aac8be50b3b6b44da7fc1722e06
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vcpkg/vcpkg.exe install --triplet=x64-windows-unimemory --overlay-triplets=cmake/triplets --x-install-root=build/sdk-installed --x-feature=mimalloc --x-feature=jemalloc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare all variants on this host with unchanged Native controls
        shell: bash
        env:
          EXPERIMENT_SOURCE_REF: ${{ inputs.source_ref }}
          EXPERIMENT_KIND: ${{ inputs.experiment_kind }}
        run: python3 tools/ci/allocator-inline-experiment.py --source-ref "$EXPERIMENT_SOURCE_REF" --experiment-kind "$EXPERIMENT_KIND" --output build/allocator-inline-experiment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allocator-inline-experiment-${{ matrix.platform.label }}
          path: |
            build/allocator-inline-experiment/manifest.json
            build/allocator-inline-experiment/summary.csv
            build/allocator-inline-experiment/README.md
            build/allocator-inline-experiment/sources/*/include/unimem/detail/adapters.inl
            build/allocator-inline-experiment/profiles/*/acceptance/
            build/allocator-inline-experiment/profiles/*/*.log
            build/allocator-inline-experiment/profiles/*/CMakeCache.txt
            build/allocator-inline-experiment/profiles/*/*-build-Release.txt
          retention-days: 90

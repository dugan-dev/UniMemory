name: build
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profiles:
    name: ${{ matrix.os }} / ${{ matrix.backend }} / stats=${{ matrix.statistics }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
        backend: [standard, mimalloc, jemalloc]
        statistics: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v5
      - name: Documentation, presets and tool tests
        shell: bash
        run: |
          python3 tools/check-docs.py
          cmake --list-presets
          python3 -m unittest discover -s tests/tools -v
          python3 tools/ci/test-profile-report.py
      - name: Pinned Unix SDKs
        if: runner.os != 'Windows' && matrix.backend != 'standard'
        run: bash tools/ci/build-backends.sh
      - name: Pinned Windows SDK toolchain
        if: runner.os == 'Windows' && matrix.backend != 'standard'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git build/vcpkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C build/vcpkg checkout 2273a28f34ce5aac8be50b3b6b44da7fc1722e06
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Complete Debug and Release tests and installed consumers
        shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          if [ "$RUNNER_OS" = Windows ]; then workspace=$(cygpath -m "$PWD"); fi
          flags=(-DCMAKE_PREFIX_PATH="$workspace/build/prefix")
          if [ "$RUNNER_OS" = Windows ] && [ '${{ matrix.backend }}' != standard ]; then
            flags+=(-DCMAKE_TOOLCHAIN_FILE="$workspace/build/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-unimemory -DVCPKG_OVERLAY_TRIPLETS="$workspace/cmake/triplets")
          fi
          for configuration in Debug Release; do
            directory="build/ci-$configuration"
            installed="$workspace/build/installed-$configuration"
            cmake -S . -B "$directory" -DCMAKE_BUILD_TYPE="$configuration" -DUNIMEMORY_BACKEND=${{ matrix.backend }} -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO -DUNIMEMORY_BUILD_EXAMPLES=ON "${flags[@]}"
            cmake --build "$directory" --config "$configuration" --parallel 4
            if [ "$RUNNER_OS" = Windows ] && [ '${{ matrix.backend }}' != standard ]; then
              sdk="$PWD/$directory/vcpkg_installed/x64-windows-unimemory"
              if [ "$configuration" = Debug ]; then export PATH="$sdk/debug/bin:$sdk/bin:$PATH"; else export PATH="$sdk/bin:$PATH"; fi
            fi
            ctest --test-dir "$directory" -C "$configuration" --parallel 4 --output-on-failure --no-tests=error
            cmake --install "$directory" --config "$configuration" --prefix "$installed"
            cmake -S tests/consumer -B "build/consumer-$configuration" -DCMAKE_BUILD_TYPE="$configuration" -DCMAKE_PREFIX_PATH="$installed;$workspace/build/prefix;$workspace/$directory/vcpkg_installed/x64-windows-unimemory" -DUNIMEMORY_BACKEND=${{ matrix.backend }} -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO
            cmake --build "build/consumer-$configuration" --config "$configuration" --parallel 4
            if [ "$RUNNER_OS" = Windows ] && [ '${{ matrix.backend }}' != standard ]; then
              sdk="$PWD/$directory/vcpkg_installed/x64-windows-unimemory"
              if [ "$configuration" = Debug ]; then export PATH="$sdk/debug/bin:$sdk/bin:$PATH"; else export PATH="$sdk/bin:$PATH"; fi
            fi
            ctest --test-dir "build/consumer-$configuration" -C "$configuration" --output-on-failure --no-tests=error
          done
      - name: Required options and invalid profiles must fail configuration
        if: matrix.backend == 'standard' && matrix.statistics == 'OFF'
        shell: bash
        run: python3 tools/ci/check-cmake-options.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.statistics }}
          path: |
            build/ci-*/Testing/Temporary/LastTest.log
            build/ci-*/CMakeCache.txt
            build/consumer-*/Testing/Temporary/LastTest.log
            build/consumer-*/conflict-*.log
            build/consumer-*/profile-request-conflicts/*.log
            build/option-validation/
          retention-days: 14
  checks-policies:
    name: ${{ matrix.os }} / checks=${{ matrix.checks }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
        checks: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v5
      - name: Explicit target-wide CHECKS policies in Debug and Release
        shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          if [ "$RUNNER_OS" = Windows ]; then workspace=$(cygpath -m "$PWD"); fi
          for configuration in Debug Release; do
            directory="build/checks-$configuration"
            cmake -S . -B "$directory" -DCMAKE_BUILD_TYPE="$configuration" -DUNIMEMORY_BACKEND=standard -DUNIMEMORY_STATISTICS=OFF -DUNIMEMORY_CHECKS=${{ matrix.checks }}
            cmake --build "$directory" --config "$configuration" --parallel 4
            ctest --test-dir "$directory" -C "$configuration" --parallel 4 --output-on-failure --no-tests=error
            cmake --install "$directory" --config "$configuration" --prefix "$workspace/build/installed-$configuration"
            cmake -S tests/consumer -B "build/consumer-$configuration" -DCMAKE_BUILD_TYPE="$configuration" -DCMAKE_PREFIX_PATH="$workspace/build/installed-$configuration" -DUNIMEMORY_CHECKS=${{ matrix.checks }}
            cmake --build "build/consumer-$configuration" --config "$configuration" --parallel 4
            ctest --test-dir "build/consumer-$configuration" -C "$configuration" --output-on-failure --no-tests=error
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.checks }}
          path: |
            build/checks-*/Testing/Temporary/LastTest.log
            build/consumer-*/Testing/Temporary/LastTest.log
            build/consumer-*/conflict-*.log
            build/consumer-*/profile-request-conflicts/*.log
  acceptance:
    name: build acceptance
    needs: [profiles, checks-policies]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.profiles.result }}' = success && test '${{ needs.checks-policies.result }}' = success

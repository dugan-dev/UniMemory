name: performance
on:
  push:
    branches: [main, dev]
    paths: ['include/**', 'tests/**', 'benchmarks/**', 'tools/**', 'cmake/**', 'CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
    inputs:
      performance_only:
        description: 'Run all performance measurements and diagnosis after verified correctness'
        type: boolean
        default: false
      correctness_recovery:
        description: 'Rerun only failed or missing correctness checks from the audited baseline'
        type: boolean
        default: false
      analysis_retry:
        description: 'Retry unresolved analysis and TSAN after the first recovery completes'
        type: boolean
        default: false
      mimalloc_only:
        type: boolean
        default: false
      threads_only:
        description: 'Validate adapters with normal third-party SDKs; reuse successful earlier analysis and headers'
        type: boolean
        default: false
      validation_only:
        description: 'Validate tools and existing published data without benchmarking'
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verified-performance:
    if: ${{ inputs.performance_only == true }}
    uses: ./.github/workflows/performance-after-validation.yml
  recover-correctness:
    if: ${{ inputs.correctness_recovery == true }}
    uses: ./.github/workflows/correctness-recovery.yml
    with:
      analysis_retry: ${{ inputs.analysis_retry }}
      threads_only: ${{ inputs.threads_only }}
      mimalloc_only: ${{ inputs.mimalloc_only }}
  changes:
    runs-on: windows-2022
    outputs:
      measure: ${{ steps.scope.outputs.measure }}
      diagnose: ${{ steps.scope.outputs.diagnose }}
    steps:
      - id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          relevant = True
          if os.environ.get('VALIDATION_ONLY') == 'true':
              relevant = False
          elif os.environ.get('PR_NUMBER'):
              files = subprocess.check_output(['gh', 'api', '--paginate', f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}/files", '--jq', '.[].filename'], text=True).splitlines()
              relevant = any(path.startswith(('include/', 'tests/', 'benchmarks/', 'tools/', 'cmake/', '.github/workflows/')) or path in ('CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json') for path in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as file:
              file.write('measure=' + str(relevant).lower() + '\n')
              file.write('diagnose=' + str(relevant and not os.environ.get('PR_NUMBER')).lower() + '\n')
          print('Source/configuration measurement required:', relevant)
          PY
  report-tests:
    if: ${{ inputs.correctness_recovery != true && inputs.performance_only != true }}
    needs: changes
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - shell: bash
        run: |
          python3 tools/check-docs.py
          cmake --list-presets
          python3 -m unittest discover -s tests/tools -v
      - shell: bash
        run: python3 tools/ci/codegen-evidence.py --self-test
      - shell: bash
        run: python3 tools/ci/test-profile-report.py
      - shell: bash
        run: python3 tools/ci/validate-published.py
  windows:
    if: ${{ inputs.correctness_recovery != true && inputs.performance_only != true }}
    needs: changes
    uses: ./.github/workflows/validation-tier.yml
    with:
      runner: windows-2022
      platform: windows-x64
      tools: '[{"os":"windows-2022","compiler":"msvc","arch":"x64"},{"os":"windows-2022","compiler":"clang-cl","arch":"x64"},{"os":"windows-2022","compiler":"mingw","arch":"x64"},{"os":"windows-11-arm","compiler":"msvc","arch":"arm64"},{"os":"windows-11-arm","compiler":"clang-cl","arch":"arm64"}]'
  measure-windows:
    needs: [changes, windows]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.windows.outputs.correctness == 'success' && needs.changes.outputs.measure == 'true' }}
    uses: ./.github/workflows/performance-measure.yml
    with:
      runner: windows-2022
      platform: windows-x64
  diagnosis-windows:
    needs: [changes, windows, measure-windows]
    # Measurement failures are retained for final acceptance and do not hide diagnosis.
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.windows.outputs.correctness == 'success' && needs.changes.outputs.diagnose == 'true' }}
    uses: ./.github/workflows/performance-diagnosis.yml
    with:
      runner: windows-2022
      platform: windows-x64
  linux:
    if: ${{ inputs.correctness_recovery != true && inputs.performance_only != true }}
    needs: changes
    uses: ./.github/workflows/validation-tier.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x64
      tools: '[{"os":"ubuntu-24.04","compiler":"gcc-13","cc":"gcc-13","cxx":"g++-13","arch":"x64"},{"os":"ubuntu-24.04","compiler":"gcc-14","cc":"gcc-14","cxx":"g++-14","arch":"x64"},{"os":"ubuntu-24.04","compiler":"clang-18","cc":"clang-18","cxx":"clang++-18","arch":"x64"},{"os":"ubuntu-24.04-arm","compiler":"gcc-13","cc":"gcc-13","cxx":"g++-13","arch":"arm64"},{"os":"ubuntu-24.04-arm","compiler":"gcc-14","cc":"gcc-14","cxx":"g++-14","arch":"arm64"},{"os":"ubuntu-24.04-arm","compiler":"clang-18","cc":"clang-18","cxx":"clang++-18","arch":"arm64"}]'
  measure-linux:
    needs: [changes, linux]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.linux.outputs.correctness == 'success' && needs.changes.outputs.measure == 'true' }}
    uses: ./.github/workflows/performance-measure.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x64
  diagnosis-linux:
    needs: [changes, linux, measure-linux]
    # Measurement failures are retained for final acceptance and do not hide diagnosis.
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.linux.outputs.correctness == 'success' && needs.changes.outputs.diagnose == 'true' }}
    uses: ./.github/workflows/performance-diagnosis.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x64
  macos:
    if: ${{ inputs.correctness_recovery != true && inputs.performance_only != true }}
    needs: changes
    uses: ./.github/workflows/validation-tier.yml
    with:
      runner: macos-15
      platform: macos-arm64
      tools: '[{"os":"macos-15-intel","compiler":"appleclang","cc":"clang","cxx":"clang++","arch":"x64"},{"os":"macos-15","compiler":"appleclang","cc":"clang","cxx":"clang++","arch":"arm64"}]'
  measure-macos:
    needs: [changes, macos]
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.macos.outputs.correctness == 'success' && needs.changes.outputs.measure == 'true' }}
    uses: ./.github/workflows/performance-measure.yml
    with:
      runner: macos-15
      platform: macos-arm64
  diagnosis-macos:
    needs: [changes, macos, measure-macos]
    # Measurement failures are retained for final acceptance and do not hide diagnosis.
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.macos.outputs.correctness == 'success' && needs.changes.outputs.diagnose == 'true' }}
    uses: ./.github/workflows/performance-diagnosis.yml
    with:
      runner: macos-15
      platform: macos-arm64
  overview:
    needs: [changes, windows, linux, macos, measure-windows, measure-linux, measure-macos, diagnosis-windows, diagnosis-linux, diagnosis-macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.changes.outputs.measure == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-*
          path: build/downloads
      - uses: actions/download-artifact@v4
        with:
          name: native-application-comparison
          path: build/native-applications
      - name: Refresh overview tables and original PNG figures
        shell: powershell
        run: |
          python tools/ci/refresh-performance-overview.py --artifacts build/downloads --native-input build/native-applications --source-revision '${{ github.sha }}' --output build/overview/comparison.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/render-benchmarks.ps1 -InputJson build/overview/comparison.json -OutputDirectory build/overview
          Copy-Item -LiteralPath README.md,README.zh-CN.md -Destination build/overview
      - uses: actions/upload-artifact@v4
        with:
          name: performance-overview
          path: build/overview/
  acceptance:
    name: performance acceptance
    needs: [changes, report-tests, windows, linux, macos, measure-windows, measure-linux, measure-macos, diagnosis-windows, diagnosis-linux, diagnosis-macos, overview]
    if: ${{ always() && inputs.correctness_recovery != true && inputs.performance_only != true }}
    runs-on: windows-2022
    steps:
      - shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs=json.loads(os.environ['RESULTS'])
          assert all(jobs[name]['result'] == 'success' for name in ('changes','report-tests','windows','linux','macos')), 'Incomplete platform validation'
          measuring=jobs['changes']['outputs']['measure'] == 'true'
          diagnosing=jobs['changes']['outputs']['diagnose'] == 'true'
          for platform in ('windows','linux','macos'):
              assert jobs[platform]['outputs']['correctness'] == 'success', 'Missing trusted correctness output'
              assert jobs['measure-'+platform]['result'] == ('success' if measuring else 'skipped'), 'Performance acceptance failed on '+platform
              assert jobs['diagnosis-'+platform]['result'] == ('success' if diagnosing else 'skipped'), 'Incomplete causal diagnosis on '+platform
          assert jobs['overview']['result'] == ('success' if measuring else 'skipped'), 'Incomplete performance publication artifacts'
          print('Parallel Windows, Linux and macOS validation passed')
          PY
  publish:
    needs: [changes, acceptance]
    timeout-minutes: 45
    if: needs.acceptance.result == 'success' && needs.changes.outputs.measure == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-*
          path: build/downloads
      - uses: actions/download-artifact@v4
        with:
          name: native-application-comparison
          path: build/native-applications
      - name: Open generated-results PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/publish-performance.py build/downloads '${{ github.ref_name }}' --native-input build/native-applications

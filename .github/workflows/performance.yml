name: performance
on:
  push:
    branches: [main, dev]
    paths: ['src/**', 'include/**', 'tests/**', 'benchmarks/**', 'tools/**', 'cmake/**', 'CMakeLists.txt', 'vcpkg.json', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Validate tools and existing published data without benchmarking'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      measure: ${{ steps.scope.outputs.measure }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          relevant = True
          if os.environ.get('VALIDATION_ONLY') == 'true':
              relevant = False
          elif os.environ.get('PR_NUMBER'):
              files = subprocess.check_output(['gh', 'api', '--paginate', f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}/files", '--jq', '.[].filename'], text=True).splitlines()
              relevant = any(path.startswith(('src/', 'include/', 'tests/', 'benchmarks/', 'tools/', 'cmake/', '.github/workflows/')) or path in ('CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json') for path in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as file:
              file.write('measure=' + str(relevant).lower() + '\n')
          print('Source/configuration measurement required:', relevant)
          PY
  report-tests:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s tests/tools -v
      - run: python3 tools/ci/validate-published.py
  measure:
    needs: [changes, report-tests]
    if: needs.changes.outputs.measure == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: linux-x64}
          - {os: windows-2022, label: windows-x64}
          - {os: macos-15, label: macos-arm64}
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned explicit backends
        if: runner.os != 'Windows'
        run: bash tools/ci/build-backends.sh
      - name: Windows pinned dependency toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git build/vcpkg
          git -C build/vcpkg checkout 2273a28f34ce5aac8be50b3b6b44da7fc1722e06
          ./build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Compile and verify benchmark build
        shell: bash
        run: |
          flags=()
          if [ "$RUNNER_OS" = Windows ]; then flags+=(-DCMAKE_TOOLCHAIN_FILE="$PWD/build/vcpkg/scripts/buildsystems/vcpkg.cmake"); fi
          cmake -S . -B build/performance -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/prefix" -DUNIMEMORY_WITH_MIMALLOC=ON -DUNIMEMORY_WITH_JEMALLOC=ON -DUNIMEMORY_BUILD_BENCHMARKS=ON "${flags[@]}"
          cmake --build build/performance --config Release --parallel 4
          ctest --test-dir build/performance -C Release --parallel 4 --output-on-failure --no-tests=error
      - name: Measure matched Native and UniMemory workloads
        shell: bash
        run: |
          executable=build/performance/UniMemoryDeliveryBenchmark
          sweep=build/performance/UniMemoryBenchmark
          if [ "$RUNNER_OS" = Windows ]; then executable=build/performance/Release/UniMemoryDeliveryBenchmark.exe; sweep=build/performance/Release/UniMemoryBenchmark.exe; fi
          python3 tools/ci/performance.py "$executable" build/results
          python3 tools/run-sweep.py "$sweep" build/results
          python3 tools/ci/performance-report.py build/results build/charts --label '${{ matrix.label }}'
      - uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.label }}
          path: |
            build/results/
            build/charts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: performance-failure-${{ matrix.label }}
          path: build/performance/Testing/Temporary/LastTest.log
  external:
    needs: changes
    if: needs.changes.outputs.measure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/ci/build-backends.sh
      - name: Existing 16 native application benchmarks
        run: bash tools/validate-benchmark-collection.sh "$PWD/build"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-application-comparison
          path: build/collection-results/
  acceptance:
    name: performance acceptance
    needs: [changes, report-tests, measure, external]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == jobs['report-tests']['result'] == 'success'
          measuring = jobs['changes']['outputs']['measure'] == 'true'
          assert all(jobs[name]['result'] == ('success' if measuring else 'skipped') for name in ('measure', 'external')), 'Incomplete performance validation'
          print('Full measurements passed' if measuring else 'No benchmark rerun needed for generated/documentation-only changes')
          PY
  publish:
    needs: acceptance
    timeout-minutes: 45
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-*
          path: build/downloads
      - name: Open generated-results PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/publish-performance.py build/downloads '${{ github.ref_name }}'

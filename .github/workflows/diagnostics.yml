name: diagnostics
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true

permissions:
  contents: read
jobs:
  optional-adapters:
    name: ${{ matrix.backend }} / stats=${{ matrix.statistics }} / ${{ matrix.sanitizer }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
        backend: [standard, mimalloc, jemalloc]
        statistics: ['OFF', 'ON']
    env:
      ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:allocator_may_return_null=1:ignore_noninstrumented_modules=1
    steps:
      - uses: actions/checkout@v5
      - name: Thread instrumentation toolchain
        if: matrix.sanitizer == 'thread'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18
          echo CC=clang-18 >> "$GITHUB_ENV"
          echo CXX=clang++-18 >> "$GITHUB_ENV"
      - name: Build existing backends without third-party instrumentation
        if: matrix.backend != 'standard'
        run: bash tools/ci/build-backends.sh
      - name: Build selected instrumented core and run its complete suite
        run: |
          cmake -S . -B build/adapters -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$PWD/build/prefix" -DUNIMEMORY_BACKEND=${{ matrix.backend }} -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO -DUNIMEMORY_SANITIZER=${{ matrix.sanitizer }}
          cmake --build build/adapters --parallel 4
          ctest --test-dir build/adapters --parallel 2 --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-adapter-${{ matrix.backend }}-${{ matrix.statistics }}-${{ matrix.sanitizer }}
          path: build/adapters/Testing/Temporary/LastTest.log
  analysis-coverage:
    strategy:
      fail-fast: false
      matrix:
        backend: [standard, mimalloc, jemalloc]
        statistics: ['OFF', 'ON']
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y g++-13 clang-18 clang-tidy-18
      - name: Build backends
        run: bash tools/ci/build-backends.sh
      - name: Static analysis
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build/analysis -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH="$PWD/build/prefix" -DUNIMEMORY_BACKEND=${{ matrix.backend }} -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO
          python3 tools/ci/analyze.py build/analysis/compile_commands.json
      - name: Project line and branch coverage
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build/coverage -DCMAKE_BUILD_TYPE=Debug -DUNIMEMORY_COVERAGE=ON -DCMAKE_PREFIX_PATH="$PWD/build/prefix" -DUNIMEMORY_BACKEND=${{ matrix.backend }} -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO
          cmake --build build/coverage --parallel 4
          ctest --test-dir build/coverage --parallel 4 --output-on-failure --no-tests=error
          python3 tools/ci/coverage.py build/coverage build/coverage-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-coverage-${{ matrix.backend }}-${{ matrix.statistics }}
          path: |
            build/coverage-report/
            build/coverage/Testing/Temporary/LastTest.log
  acceptance:
    name: diagnostics acceptance
    needs: [optional-adapters, analysis-coverage]
    if: always()
    runs-on: ${{ inputs.runner }}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values()), 'A required diagnostic failed'
          PY

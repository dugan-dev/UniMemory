name: correctness recovery
on:
  workflow_call:
    inputs:
      baseline_run:
        type: string
        default: '38262808305'
      baseline_sha:
        type: string
        default: '06dc705'
      mimalloc_only:
        type: boolean
        default: false
      threads_only:
        type: boolean
        default: false
      analysis_retry:
        type: boolean
        default: false
      previous_recovery_run:
        type: string
        default: '38332523441'
      allow_source_changes:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'Audited baseline run; passed checks keep their original source revision'
        type: string
        default: '38262808305'
      baseline_sha:
        description: 'Expected baseline source revision'
        type: string
        default: '06dc705'
      mimalloc_only:
        type: boolean
        default: false
      threads_only:
        type: boolean
        default: false
      analysis_retry:
        description: 'Retry static analysis, changed headers and unresolved TSAN; inherit verified previous checks/tools/coverage'
        type: boolean
        default: false
      previous_recovery_run:
        description: 'Completed previous recovery run supplying inherited evidence'
        type: string
        default: '38332523441'
      allow_source_changes:
        description: 'Run targeted checks after library changes; final acceptance still requires additional regression'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: correctness-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  provenance:
    runs-on: ubuntu-24.04
    outputs:
      requires_regression: ${{ steps.evidence.outputs.requires_regression }}
      inherited_verified: ${{ steps.evidence.outputs.inherited_verified }}
      inherited_fixtures_verified: ${{ steps.fixtures.outputs.verified }}
      inherited_jemalloc_verified: ${{ steps.jemalloc.outputs.verified }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          ALLOW_SOURCE: ${{ inputs.allow_source_changes }}
          ANALYSIS_RETRY: ${{ inputs.analysis_retry }}
          PREVIOUS_RECOVERY: ${{ inputs.previous_recovery_run }}
        run: |
          python3 -m unittest discover -s tests/tools -p test_correctness_recovery.py -v
          flags=()
          if [ "$ALLOW_SOURCE" = true ]; then flags+=(--allow-source-changes); fi
          if [ "$ANALYSIS_RETRY" = true ]; then flags+=(--analysis-retry --previous-recovery-run "$PREVIOUS_RECOVERY"); fi
          python3 tools/ci/correctness-recovery.py --baseline-run "$BASELINE_RUN" --baseline-sha "$BASELINE_SHA" --output build/recovery-provenance.json "${flags[@]}"
      - id: fixtures
        if: inputs.threads_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/correctness-recovery.py --verify-fixtures-run 38334414833 --output build/recovery-fixtures.json
      - id: jemalloc
        if: inputs.mimalloc_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/correctness-recovery.py --verify-adapters-run 38337572031 --output build/recovery-jemalloc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-provenance
          path: |
            build/recovery-provenance.json
            build/recovery-fixtures.json
            build/recovery-jemalloc.json
  report-tests:
    needs: provenance
    if: ${{ !inputs.analysis_retry }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Complete tools suite including repaired overview and recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/tools -v
          python3 tools/check-docs.py
          python3 tools/ci/codegen-evidence.py --self-test
          python3 tools/ci/test-profile-report.py
          python3 tools/ci/validate-published.py
  checks:
    needs: provenance
    if: ${{ !inputs.analysis_retry }}
    name: missing standard Release OFF / ${{ matrix.runner }} / checks=${{ matrix.checks }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, checks: AUTO, arch: x64}
          - {runner: ubuntu-24.04, checks: 'ON', arch: x64}
          - {runner: ubuntu-24.04, checks: 'OFF', arch: x64}
          - {runner: ubuntu-24.04-arm, checks: AUTO, arch: arm64}
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v5
      - name: Existing GCC13 toolchain
        run: |
          if ! command -v g++-13 >/dev/null; then
            timeout 300 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            timeout 300 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y g++-13
          fi
      - name: Complete correctness and installed consumers; AUTO x64 also covers GCC13 portability
        run: |
          cmake -S . -B build/recovery -G Ninja -DCMAKE_BUILD_TYPE=Release -DUNIMEMORY_BACKEND=standard -DUNIMEMORY_STATISTICS=OFF -DUNIMEMORY_CHECKS=${{ matrix.checks }} -DUNIMEMORY_BUILD_EXAMPLES=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          python3 tools/ci/toolchain-manifest.py build/recovery --compiler gcc-13 --arch '${{ matrix.arch }}'
          cmake --build build/recovery --parallel 4
          ctest --test-dir build/recovery --parallel 4 --output-on-failure --no-tests=error
          cmake --install build/recovery --prefix "$PWD/build/installed"
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/installed" -DUNIMEMORY_BACKEND=standard -DUNIMEMORY_STATISTICS=OFF -DUNIMEMORY_CHECKS=${{ matrix.checks }}
          cmake --build build/consumer --parallel 4
          ctest --test-dir build/consumer --output-on-failure --no-tests=error
      - name: Changed allocation-failure fixture statistics-ON control only
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-24.04' && matrix.checks == 'AUTO' }}
        run: |
          cmake -S . -B build/allocation-control -DCMAKE_BUILD_TYPE=Release -DUNIMEMORY_BACKEND=standard -DUNIMEMORY_STATISTICS=ON -DUNIMEMORY_CHECKS=AUTO
          cmake --build build/allocation-control --target UniMemoryAllocationFailure --parallel 4
          ctest --test-dir build/allocation-control -R 'allocation_failure_|^UniMemory.global.initialization_retry$' --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ matrix.runner }}-${{ matrix.checks }}
          path: |
            build/allocation-control/Testing/Temporary/LastTest.log
            build/recovery/CMakeCache.txt
            build/recovery/toolchain.json
            build/recovery/Testing/Temporary/LastTest.log
            build/consumer/Testing/Temporary/LastTest.log
            build/consumer/*conflict*.log
            build/consumer/profile-request-conflicts/*.log
  analysis:
    if: ${{ !inputs.threads_only }}
    needs: provenance
    name: missing standard analysis and coverage / stats=${{ matrix.statistics }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        statistics: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v5
      - name: Existing static analysis and coverage toolchains
        run: |
          if ! command -v clang-tidy-18 >/dev/null || ! command -v clang++-18 >/dev/null || ! command -v g++-13 >/dev/null; then
            timeout 300 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            timeout 300 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y g++-13 clang-18 clang-tidy-18
          fi
      - name: All project header consumer static warnings are errors
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build/analysis -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DUNIMEMORY_BACKEND=standard -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO
          python3 tools/ci/analyze.py build/analysis/compile_commands.json
      - name: Complete project line and branch coverage
        if: ${{ !cancelled() && !inputs.analysis_retry }}
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build/coverage -DCMAKE_BUILD_TYPE=Debug -DUNIMEMORY_COVERAGE=ON -DUNIMEMORY_BACKEND=standard -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO
          cmake --build build/coverage --parallel 4
          ctest --test-dir build/coverage --parallel 4 --output-on-failure --no-tests=error
          python3 tools/ci/coverage.py build/coverage build/coverage-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-analysis-${{ matrix.statistics }}
          path: |
            build/analysis/compile_commands.json
            build/coverage-report/
            build/coverage/Testing/Temporary/LastTest.log
  headers:
    if: ${{ !inputs.threads_only }}
    needs: provenance
    name: changed header fixtures / ${{ matrix.runner }} / stats=${{ matrix.statistics }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15]
        statistics: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v5
      - shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          if [ "$RUNNER_OS" = Windows ]; then workspace=$(cygpath -m "$PWD"); fi
          cmake -S . -B build/headers -DCMAKE_BUILD_TYPE=Release -DUNIMEMORY_BACKEND=standard -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO
          cmake --build build/headers --config Release --target UniMemoryHeaderTests UniMemoryFactoryCompileRegression --parallel 4
          ctest --test-dir build/headers -C Release -R '^UniMemory.headers$' --output-on-failure --no-tests=error
          cmake --install build/headers --config Release --prefix "$workspace/build/installed"
          cmake -S tests/consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$workspace/build/installed"
          cmake --build build/consumer --config Release --parallel 4
          ctest --test-dir build/consumer -C Release --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-headers-${{ matrix.runner }}-${{ matrix.statistics }}
          path: |
            build/headers/Testing/Temporary/LastTest.log
            build/consumer/Testing/Temporary/LastTest.log
  threads:
    needs: provenance
    name: ${{ matrix.backend }} ${{ matrix.statistics }} adapter thread sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.mimalloc_only && '["mimalloc"]' || '["mimalloc","jemalloc"]') }}
        statistics: ['OFF', 'ON']
    env:
      CC: clang-18
      CXX: clang++-18
      TSAN_OPTIONS: halt_on_error=1:allocator_may_return_null=1:ignore_noninstrumented_modules=1
    steps:
      - uses: actions/checkout@v5
      - name: Use installed Clang18; bound package-manager network waits
        run: |
          if ! command -v clang++-18 >/dev/null; then
            timeout 300 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            timeout 300 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y clang-18
          fi
      - name: Build SDKs with allocator synchronization and no third-party tests
        run: bash tools/ci/build-backends.sh thread
      - name: Entire UniMemory adapter thread sanitizer suite
        run: |
          cmake -S . -B build/adapters -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$PWD/build/prefix" -DUNIMEMORY_BACKEND=${{ matrix.backend }} -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO -DUNIMEMORY_SANITIZER=thread
          cmake --build build/adapters --parallel 4
          ctest --test-dir build/adapters --parallel 2 --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ matrix.backend }}-${{ matrix.statistics }}-thread
          path: |
            build/adapters/Testing/Temporary/LastTest.log
            build/adapters/CMakeCache.txt
            build/adapters/CMakeFiles/CMakeConfigureLog.yaml
  acceptance:
    name: targeted correctness recovery acceptance
    needs: [provenance, report-tests, checks, analysis, headers, threads]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          MIMALLOC_ONLY: ${{ inputs.mimalloc_only }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs=json.loads(os.environ['RESULTS'])
          if os.environ['MIMALLOC_ONLY'] == 'true':
              assert jobs['provenance']['outputs']['inherited_jemalloc_verified'] == 'true', 'Jemalloc evidence missing'
          inherited=jobs['provenance'].get('outputs',{}).get('inherited_verified') == 'true'
          skip={'report-tests','checks'} if inherited else set()
          if jobs['provenance'].get('outputs',{}).get('inherited_fixtures_verified') == 'true':
              skip.update({'analysis','headers'})
          assert all(job['result']==('skipped' if name in skip else 'success') for name,job in jobs.items()), 'A required recovery target failed or did not run'
          assert jobs['provenance']['outputs']['requires_regression']=='false', 'Library changed: baseline inheritance forbidden; additional regression required'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write(('Analysis retry passed with verified earlier checks/tools/coverage; unresolved TSAN reran. ' if inherited else '') + 'Targeted correctness recovery passed. Passed historical jobs remain evidence for their baseline SHA; only listed recovery targets ran at this SHA. No performance workloads requested.\n')
          PY

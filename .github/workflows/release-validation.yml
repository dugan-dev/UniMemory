name: release-validation

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'tools/**'
      - 'cmake/**'
      - 'vcpkg.json'
      - 'CMakeLists.txt'
      - '.github/workflows/**'
jobs:
  rpmalloc-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run test-only rpmalloc suites
        run: bash tools/validate-rpmalloc.sh "$PWD/build/rpmalloc-validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpmalloc-upstream
          path: |
            build/rpmalloc-validation/*.log
            build/rpmalloc-validation/environment.json
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build/sanitize -DCMAKE_BUILD_TYPE=Debug -DUNIMEMORY_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build/sanitize --parallel 4
      - name: Test
        env:
          ASAN_OPTIONS: allocator_may_return_null=1
          TSAN_OPTIONS: halt_on_error=1:allocator_may_return_null=1
        run: ctest --test-dir build/sanitize --output-on-failure --parallel 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitizer-${{ matrix.sanitizer }}
          path: build/sanitize/Testing/Temporary/LastTest.log
  native-unix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Native mimalloc tests
        shell: bash
        run: |
          git clone --depth 1 --branch v3.4.3 https://github.com/microsoft/mimalloc.git build/mimalloc
          cmake -S build/mimalloc -B build/mi -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=ON -DMI_OVERRIDE=OFF -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix"
          cmake --build build/mi --parallel 4
          ctest --test-dir build/mi --output-on-failure
          cmake --install build/mi
      - name: Native jemalloc tests and stress
        shell: bash
        run: |
          curl -L --fail https://github.com/jemalloc/jemalloc/releases/download/5.3.1/jemalloc-5.3.1.tar.bz2 -o build/jemalloc.tar.bz2
          tar -xf build/jemalloc.tar.bz2 -C build
          python3 tools/patch-jemalloc-tests.py build/jemalloc-5.3.1
          cd build/jemalloc-5.3.1
          ./configure --with-jemalloc-prefix=je_ --disable-cxx --enable-prof --prefix="$GITHUB_WORKSPACE/build/prefix"
          make -j4
          make check -j4 > ../jemalloc-check.log 2>&1
          make stress > ../jemalloc-stress.log 2>&1
          make analyze > ../jemalloc-analyze.log 2>&1
          make install
      - name: UniMemory with both explicit backends
        shell: bash
        run: |
          cmake -S . -B build/all -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/prefix" -DUNIMEMORY_WITH_MIMALLOC=ON -DUNIMEMORY_WITH_JEMALLOC=ON -DUNIMEMORY_BUILD_BENCHMARKS=ON
          cmake --build build/all --parallel 4
          ctest --test-dir build/all --output-on-failure --parallel 4
          cmake --install build/all --prefix build/installed
          cmake -S tests/consumer -B build/consumer -DCMAKE_PREFIX_PATH="$PWD/build/installed;$PWD/build/prefix"
          cmake --build build/consumer --parallel 4
          ctest --test-dir build/consumer --output-on-failure
          build/all/UniMemoryBenchmark --full > build/benchmark.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            build/*-*.log
            build/mi/Testing/Temporary/LastTest.log
            build/all/Testing/Temporary/LastTest.log
            build/benchmark.csv

  acceptance:
    name: release acceptance
    needs: [rpmalloc-upstream, sanitizers, native-unix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required release jobs did not pass: ' + ', '.join(failed))
          print('All required release validation jobs passed.')
          PY

name: release-validation

permissions:
  contents: read


on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true

jobs:
  native-unix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ["${{ inputs.runner }}"]
    steps:
      - uses: actions/checkout@v5
      - name: Build mimalloc SDK
        shell: bash
        run: |
          git clone --depth 1 --branch v3.4.3 https://github.com/microsoft/mimalloc.git build/mimalloc
          test "$(git -C build/mimalloc rev-parse HEAD)" = 152fbf2634aeafca3774df791b0a77683035f076
          cmake -S build/mimalloc -B build/mi -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=OFF -DMI_OVERRIDE=OFF -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix"
          cmake --build build/mi --parallel 4
          cmake --install build/mi
      - name: Build jemalloc SDK
        shell: bash
        run: |
          curl -L --fail https://github.com/jemalloc/jemalloc/releases/download/5.3.1/jemalloc-5.3.1.tar.bz2 -o build/jemalloc.tar.bz2
          tar -xf build/jemalloc.tar.bz2 -C build
          cd build/jemalloc-5.3.1
          ./configure --with-jemalloc-prefix=je_ --disable-cxx --enable-prof --prefix="$GITHUB_WORKSPACE/build/prefix"
          make -j4
          make install
      - name: Validate shared and static SDK installed packages
        shell: bash
        run: bash tools/validate-packaging.sh "$PWD/build"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            build/*-*.log
            build/mi/Testing/Temporary/LastTest.log
            build/*-test.log
            build/*-consumer/conflict-*.log
            build/*-consumer/profile-request-conflicts/*.log

  acceptance:
    name: release acceptance
    needs: [native-unix]
    if: ${{ always() }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Require every release validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] !=
                    'success']
          if failed:
              raise SystemExit('Required release jobs did not pass: ' + ', '.join(failed))
          print('All required release validation jobs passed.')
          PY

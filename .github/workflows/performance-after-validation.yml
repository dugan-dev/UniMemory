name: performance after correctness
on:
  workflow_call:
    inputs:
      retry_failed:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: verified-performance-${{ github.ref }}-${{ inputs.retry_failed }}
  cancel-in-progress: false
jobs:
  correctness-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require completed UniMemory correctness acceptance and unchanged measured sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def command(*args):
              return subprocess.check_output(args,text=True).strip()
          repository=os.environ['GITHUB_REPOSITORY']
          run_id=38338153588
          run=json.loads(command('gh','api',f'repos/{repository}/actions/runs/{run_id}'))
          assert run['head_repository']['full_name']==repository
          assert run['event']=='workflow_dispatch' and run['status']=='completed' and run['conclusion']=='success'
          assert run['path'].split('@',1)[0]=='.github/workflows/performance.yml'
          pages=json.loads(command('gh','api','--paginate','--slurp',f'repos/{repository}/actions/runs/{run_id}/jobs?per_page=100'))
          accepted=[job for page in pages for job in page['jobs'] if job['name']=='recover-correctness / targeted correctness recovery acceptance']
          assert len(accepted)==1 and accepted[0]['conclusion']=='success'
          head=command('git','rev-parse','HEAD')
          assert head==os.environ['GITHUB_SHA']
          subprocess.run(['git','merge-base','--is-ancestor',run['head_sha'],head],check=True)
          changed=command('git','diff','--name-only',run['head_sha'],head).splitlines()
          assert not any(path.startswith(('include/','benchmarks/','cmake/')) or path in ('CMakeLists.txt','CMakePresets.json','vcpkg.json') for path in changed), 'Measured sources changed since correctness acceptance'
          evidence=dict(correctness_run=run_id,correctness_sha=run['head_sha'],measured_sha=head,changed_paths=changed)
          Path('performance-correctness-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: performance-correctness-evidence
          path: performance-correctness-evidence.json
  fault-fixtures:
    needs: correctness-evidence
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, ubuntu-24.04, macos-15]
        statistics: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v5
      - shell: bash
        run: |
          set -euo pipefail
          for ipo in OFF ON; do
            directory="build/fault-$ipo"
            cmake -S . -B "$directory" -DCMAKE_BUILD_TYPE=Release -DUNIMEMORY_BACKEND=standard -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO -DUNIMEMORY_IPO="$ipo"
            cmake --build "$directory" --config Release --target UniMemoryAllocationFailure --parallel 4
            ctest --test-dir "$directory" -C Release -R 'allocation_failure_|^UniMemory.global.initialization_retry$' --output-on-failure --no-tests=error
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-${{ matrix.runner }}-${{ matrix.statistics }}
          path: build/fault-*/Testing/Temporary/LastTest.log
  measure:
    needs: [correctness-evidence, fault-fixtures]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, platform: windows-x64}
          - {runner: ubuntu-24.04, platform: linux-x64}
          - {runner: macos-15, platform: macos-arm64}
    uses: ./.github/workflows/performance-measure.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
  diagnosis:
    needs: [correctness-evidence, fault-fixtures]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.retry_failed && '[{"runner":"windows-2022","platform":"windows-x64","backends":"[\"standard\"]"}]' || '[{"runner":"windows-2022","platform":"windows-x64","backends":"[\"standard\",\"mimalloc\",\"jemalloc\"]"},{"runner":"ubuntu-24.04","platform":"linux-x64","backends":"[\"standard\",\"mimalloc\",\"jemalloc\"]"},{"runner":"macos-15","platform":"macos-arm64","backends":"[\"standard\",\"mimalloc\",\"jemalloc\"]"}]') }}
    uses: ./.github/workflows/performance-diagnosis.yml
    with:
      backends: ${{ matrix.backends }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
  overview:
    needs: [correctness-evidence, fault-fixtures, measure, diagnosis]
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-*
          path: build/downloads
      - uses: actions/download-artifact@v4
        with:
          name: native-application-comparison
          path: build/native-applications
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Assemble complete measurements and figures
        shell: powershell
        run: |
          python tools/ci/refresh-performance-overview.py --artifacts build/downloads --native-input build/native-applications --source-revision '${{ github.sha }}' --output build/overview/comparison.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/render-benchmarks.ps1 -InputJson build/overview/comparison.json -OutputDirectory build/overview
          Copy-Item -LiteralPath README.md,README.zh-CN.md -Destination build/overview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-overview
          path: build/overview/
  acceptance:
    needs: [correctness-evidence, fault-fixtures, measure, diagnosis, overview]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          if os.environ['RETRY_FAILED']=='true':
              repository=os.environ['GITHUB_REPOSITORY']
              pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{repository}/actions/runs/38340149739/jobs?per_page=100'],text=True))
              old=[job for page in pages for job in page['jobs'] if job['name'].startswith('verified-performance / diagnosis') and not job['name'].endswith('windows-x64, standard)')]
              assert len(old)==8 and all(job['status']=='completed' and job['conclusion']=='success' for job in old), 'A previous diagnosis remains incomplete or failed'
              print('Verified eight earlier same-library diagnosis jobs; repaired Windows Standard diagnosis reran.')
          jobs=json.loads(os.environ['RESULTS'])
          assert all(job['result']=='success' for job in jobs.values()), 'Incomplete performance evidence or a failed >=90% gate'
          print('All three platforms, all three backends and their controlled diagnosis passed.')
          PY

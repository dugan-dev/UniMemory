name: measured performance results
on:
  workflow_call:
    inputs:
      measured_run:
        type: string
        default: '38340749502'
      source_revision:
        type: string
        default: 'fe90b68953b3af88d7ebd3d64131e76673c234ca'
      baseline_diagnosis_run:
        type: string
        default: '38340149739'
permissions:
  contents: read
  actions: read
jobs:
  results:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Audit completed original measurements and diagnosis leaves
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MEASURED_RUN: ${{ inputs.measured_run }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          BASELINE_DIAGNOSIS_RUN: ${{ inputs.baseline_diagnosis_run }}
        run: python3 tools/ci/performance-results.py audit --measured-run "$MEASURED_RUN" --source-revision "$SOURCE_REVISION" --baseline-diagnosis-run "$BASELINE_DIAGNOSIS_RUN"
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-*
          path: build/downloads
          github-token: ${{ github.token }}
          run-id: ${{ inputs.measured_run }}
      - uses: actions/download-artifact@v4
        with:
          name: native-application-comparison
          path: build/native-applications
          github-token: ${{ github.token }}
          run-id: ${{ inputs.measured_run }}
      - name: Reassemble actual measured source and retain every gate ratio
        id: assemble
        shell: powershell
        run: |
          python tools/ci/performance-results.py assemble
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/render-benchmarks.ps1 -InputJson build/performance-results/comparison.json -OutputDirectory build/performance-results
          Copy-Item -LiteralPath README.md,README.zh-CN.md -Destination build/performance-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-performance-audit
          path: |
            build/performance-results/source-audit.json
            build/performance-results/gate-report.json
            build/performance-results/gate-report.md
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        with:
          name: measured-performance-results
          path: |
            build/performance-results/
            docs/results/current/
            docs/images/performance/
            docs/performance.md
            docs/performance.zh-CN.md
            docs/performance/
          retention-days: 90
      - name: Require original successful main jobs and every unchanged >=90% gate
        shell: bash
        run: python3 tools/ci/performance-results.py accept

name: portability
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      tools:
        type: string
        required: true

permissions:
  contents: read
jobs:
  compiler:
    name: ${{ matrix.tool.os }} / ${{ matrix.tool.compiler }} / ${{ matrix.configuration }} / stats=${{ matrix.statistics }}
    runs-on: ${{ matrix.tool.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        statistics: ['OFF', 'ON']
        tool: ${{ fromJSON(inputs.tools) }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-13 g++-14 clang-18 ninja-build
      - name: Unix compiler selection
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo 'CC=${{ matrix.tool.cc }}' >> "$GITHUB_ENV"
          echo 'CXX=${{ matrix.tool.cxx }}' >> "$GITHUB_ENV"
          ${{ matrix.tool.cxx }} --version
          uname -m
      - name: Windows compiler selection
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/windows-toolchain.ps1 -Compiler '${{ matrix.tool.compiler }}' -Architecture '${{ matrix.tool.arch }}'
      - name: Configure, build, test and install
        shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          if [ "$RUNNER_OS" = Windows ]; then workspace=$(cygpath -m "$PWD"); fi
          cmake -S . -B build/portable -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DUNIMEMORY_BACKEND=standard -DUNIMEMORY_STATISTICS=${{ matrix.statistics }} -DUNIMEMORY_CHECKS=AUTO -DUNIMEMORY_BUILD_EXAMPLES=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          python3 tools/ci/toolchain-manifest.py build/portable --compiler '${{ matrix.tool.compiler }}' --arch '${{ matrix.tool.arch }}'
          cmake --build build/portable --parallel 4
          ctest --test-dir build/portable --parallel 4 --output-on-failure --no-tests=error
          cmake --install build/portable --prefix "$workspace/build/installed"
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_PREFIX_PATH="$workspace/build/installed"
          cmake --build build/consumer --parallel 4
          ctest --test-dir build/consumer --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portability-${{ matrix.tool.os }}-${{ matrix.tool.compiler }}-${{ matrix.configuration }}-${{ matrix.statistics }}
          path: |
            build/portable/CMakeCache.txt
            build/portable/toolchain.json
            build/portable/Testing/Temporary/LastTest.log
            build/consumer/Testing/Temporary/LastTest.log
            build/consumer/profile-request-conflicts/*.log
            build/consumer/conflict-*.log
  acceptance:
    name: portability acceptance
    needs: compiler
    if: always()
    runs-on: ${{ inputs.runner }}
    steps:
      - shell: bash
        run: test '${{ needs.compiler.result }}' = success

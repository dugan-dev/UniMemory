name: portability
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compiler:
    name: ${{ matrix.tool.os }} / ${{ matrix.tool.compiler }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.tool.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        tool:
          - {os: ubuntu-24.04, compiler: gcc-13, cc: gcc-13, cxx: g++-13, arch: x64}
          - {os: ubuntu-24.04, compiler: gcc-14, cc: gcc-14, cxx: g++-14, arch: x64}
          - {os: ubuntu-24.04, compiler: clang-18, cc: clang-18, cxx: clang++-18, arch: x64}
          - {os: ubuntu-24.04-arm, compiler: gcc-13, cc: gcc-13, cxx: g++-13, arch: arm64}
          - {os: ubuntu-24.04-arm, compiler: gcc-14, cc: gcc-14, cxx: g++-14, arch: arm64}
          - {os: ubuntu-24.04-arm, compiler: clang-18, cc: clang-18, cxx: clang++-18, arch: arm64}
          - {os: windows-2022, compiler: msvc, arch: x64}
          - {os: windows-2022, compiler: clang-cl, arch: x64}
          - {os: windows-2022, compiler: mingw, arch: x64}
          - {os: windows-11-arm, compiler: msvc, arch: arm64}
          - {os: windows-11-arm, compiler: clang-cl, arch: arm64}
          - {os: macos-15-intel, compiler: appleclang, cc: clang, cxx: clang++, arch: x64}
          - {os: macos-15, compiler: appleclang, cc: clang, cxx: clang++, arch: arm64}
    steps:
      - uses: actions/checkout@v5
      - name: Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-13 g++-14 clang-18 ninja-build
      - name: Unix compiler selection
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo 'CC=${{ matrix.tool.cc }}' >> "$GITHUB_ENV"
          echo 'CXX=${{ matrix.tool.cxx }}' >> "$GITHUB_ENV"
          ${{ matrix.tool.cxx }} --version
          uname -m
      - name: Windows compiler selection
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/windows-toolchain.ps1 -Compiler '${{ matrix.tool.compiler }}' -Architecture '${{ matrix.tool.arch }}'
      - name: Configure, build, test and install
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/portable -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DUNIMEMORY_BUILD_EXAMPLES=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          python3 tools/ci/toolchain-manifest.py build/portable --compiler '${{ matrix.tool.compiler }}' --arch '${{ matrix.tool.arch }}'
          cmake --build build/portable --parallel 4
          ctest --test-dir build/portable --parallel 4 --output-on-failure --no-tests=error
          cmake --install build/portable --prefix build/installed
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_PREFIX_PATH="$PWD/build/installed"
          cmake --build build/consumer --parallel 4
          ctest --test-dir build/consumer --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portability-${{ matrix.tool.os }}-${{ matrix.tool.compiler }}-${{ matrix.configuration }}
          path: |
            build/portable/CMakeCache.txt
            build/portable/toolchain.json
            build/portable/Testing/Temporary/LastTest.log
            build/consumer/Testing/Temporary/LastTest.log
  acceptance:
    name: portability acceptance
    needs: compiler
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.compiler.result }}' = success
